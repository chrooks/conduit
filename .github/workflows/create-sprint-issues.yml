name: Create Sprint Issues

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      sprint_number:
        description: 'Sprint number to process (1-5)'
        required: true
        default: '1'
      create_project:
        description: 'Create/update GitHub Project'
        required: false
        default: 'true'
      project_name:
        description: 'GitHub Project name'
        required: false
        default: 'Conduit App'
  
  # Optionally trigger when progress.md is updated
  push:
    paths:
      - 'memory-bank/progress.md'
    branches:
      - main

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @actions/github @actions/core js-yaml

      - name: Create Sprint Issues
        uses: actions/github-script@v6
        with:
          # IMPORTANT: For GitHub Actions, use PERSONAL_ACCESS_TOKEN with repo and project permissions
          # For local testing with act, use GITHUB_TOKEN
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // core and github are already imported by the github-script action
            // No need to require them again
            
            // Get sprint number from input or default to processing all sprints
            const sprintNumber = context.payload.inputs ? context.payload.inputs.sprint_number : null;
            const createProject = context.payload.inputs ? context.payload.inputs.create_project === 'true' : true;
            const projectName = context.payload.inputs ? context.payload.inputs.project_name : 'Conduit App';
            
            // Read progress.md file
            const progressFile = fs.readFileSync('./memory-bank/progress.md', 'utf8');
            
            // Debug: Log a portion of the file to verify content
            console.log("Progress.md file content preview (first 500 chars):");
            console.log(progressFile.substring(0, 500) + "...");
            
            // Function to extract sprint tasks with descriptions and acceptance criteria
            function extractSprintTasks(content, sprintNum) {
              console.log(`Extracting tasks for Sprint ${sprintNum}...`);
              
              // Find the sprint section - looking for ### Sprint X: header
              const sprintHeaderRegex = new RegExp(`### Sprint ${sprintNum}: [^\\n]+`, 'g');
              const sprintHeaderMatch = sprintHeaderRegex.exec(content);
              
              if (!sprintHeaderMatch) {
                console.log(`No header found for Sprint ${sprintNum}`);
                return [];
              }
              
              const sprintHeaderPos = sprintHeaderMatch.index;
              console.log(`Found header for Sprint ${sprintNum} at position ${sprintHeaderPos}`);
              
              // Find the next sprint header or section header to determine the end of this sprint section
              const nextHeaderRegex = /### Sprint \d+:|### Post-MVP Features|## Current Status Details/g;
              nextHeaderRegex.lastIndex = sprintHeaderPos + sprintHeaderMatch[0].length;
              const nextHeaderMatch = nextHeaderRegex.exec(content);
              
              const sprintEndPos = nextHeaderMatch ? nextHeaderMatch.index : content.length;
              const sprintSection = content.substring(sprintHeaderPos, sprintEndPos);
              
              console.log(`Extracted Sprint ${sprintNum} section, length: ${sprintSection.length} characters`);
              console.log(`Sprint section preview: ${sprintSection.substring(0, 200)}...`);
              
              // Extract task sections - each task has a #### header
              const taskSections = sprintSection.split(/#### /).slice(1);
              console.log(`Found ${taskSections.length} potential task sections`);
              
              if (taskSections.length === 0) {
                console.log(`No task sections found in Sprint ${sprintNum}`);
                return [];
              }
              
              return taskSections.map(section => {
                // Extract task name (first line)
                const taskNameMatch = section.match(/^([^\n]+)/);
                const taskName = taskNameMatch ? taskNameMatch[1].trim() : `Unknown Task in Sprint ${sprintNum}`;
                console.log(`Processing task: ${taskName}`);
                
                // Extract description
                const descriptionMatch = section.match(/\*\*Description\*\*:\s+(.*?)(?=\s+\*\*Acceptance Criteria\*\*)/s);
                const description = descriptionMatch ? descriptionMatch[1].trim() : '';
                
                // Extract acceptance criteria
                const criteriaMatch = section.match(/\*\*Acceptance Criteria\*\*:\s+([\s\S]*?)(?=\s+\*\*Subtasks\*\*|\n\n#### |\n\n### |\n\n## |$)/);
                const acceptanceCriteria = criteriaMatch ? criteriaMatch[1].trim() : '';
                
                // Extract subtasks if they exist
                const subtasksMatch = section.match(/\*\*Subtasks\*\*:\s+([\s\S]*?)(?=\n\n#### |\n\n### |\n\n## |$)/);
                const subtasksContent = subtasksMatch ? subtasksMatch[1].trim() : '';
                
                let subtasks = [];
                if (subtasksContent) {
                  console.log(`Found subtasks content for ${taskName}, length: ${subtasksContent.length} characters`);
                  
                  // Split by numbered items (1., 2., etc.)
                  const subtaskItems = subtasksContent.split(/\n\d+\.\s+/).filter(Boolean);
                  console.log(`Found ${subtaskItems.length} subtask items`);
                  
                  subtasks = subtaskItems.map((item, index) => {
                    // Extract subtask name - improved regex to better match the format
                    // First, check if this is the first subtask (index 0) with a special format
                    let subtaskName;
                    
                    if (index === 0) {
                      // For the first subtask, look for the pattern "1. **Name**" or just "**Name**"
                      const firstSubtaskMatch = item.match(/^\d*\.*\s*\*\*([^*]+)\*\*/);
                      if (firstSubtaskMatch) {
                        subtaskName = firstSubtaskMatch[1].trim();
                      }
                    } else {
                      // For other subtasks, use the original pattern
                      const subtaskNameMatch = item.match(/^\*\*([^*]+)\*\*/);
                      if (subtaskNameMatch) {
                        subtaskName = subtaskNameMatch[1].trim();
                      }
                    }
                    
                    // If we still don't have a name, try other methods
                    if (!subtaskName) {
                      // Try to get the name from the first line before "Description"
                      const firstLineMatch = item.match(/^([^*\n]+?)(?=\s+\*\*Description\*\*)/);
                      if (firstLineMatch) {
                        subtaskName = firstLineMatch[1].trim();
                      } else {
                        // Fallback to a generic name with index
                        subtaskName = `Subtask ${index+1}`;
                      }
                    }
                    
                    // For debugging
                    console.log(`Extracted subtask name: "${subtaskName}" from item: "${item.substring(0, 50)}..."`);
                    
                    // Extract subtask description
                    const subtaskDescMatch = item.match(/\*\*Description\*\*:\s+(.*?)(?=\s+\*\*Acceptance Criteria\*\*)/s);
                    const subtaskDesc = subtaskDescMatch ? subtaskDescMatch[1].trim() : '';
                    
                    // Extract subtask acceptance criteria
                    const subtaskCriteriaMatch = item.match(/\*\*Acceptance Criteria\*\*:\s+([\s\S]*?)$/);
                    const subtaskCriteria = subtaskCriteriaMatch ? subtaskCriteriaMatch[1].trim() : '';
                    
                    return {
                      name: subtaskName,
                      description: subtaskDesc,
                      acceptanceCriteria: subtaskCriteria
                    };
                  });
                }
                
                return {
                  name: taskName,
                  description,
                  acceptanceCriteria,
                  subtasks
                };
              });
            }
            
            // Process sprints
            async function processSprints() {
              // In github-script, we use the pre-authenticated octokit client
              const octokit = github;
              const { owner, repo } = context.repo;
              
              console.log(`Repository: ${owner}/${repo}`);
              
              // Create or get project if needed
              let projectId = null;
              if (createProject) {
                try {
                  // First try to get user's projects
                  console.log(`Looking for projects for user ${owner}...`);
                  
                  try {
                    // Try user projects first
                    const userProjectQuery = await octokit.graphql(`
                      query {
                        user(login: "${owner}") {
                          projectsV2(first: 20) {
                            nodes {
                              id
                              title
                            }
                          }
                        }
                      }
                    `);
                    
                    const userProjects = userProjectQuery.user.projectsV2.nodes;
                    const existingUserProject = userProjects.find(p => p.title === projectName);
                    
                    if (existingUserProject) {
                      projectId = existingUserProject.id;
                      console.log(`Found existing user project: ${projectName} (${projectId})`);
                    } else {
                      // Create new project for user
                      const userIdQuery = await octokit.graphql(`
                        query {
                          user(login: "${owner}") {
                            id
                          }
                        }
                      `);
                      
                      const userId = userIdQuery.user.id;
                      
                      const newProject = await octokit.graphql(`
                        mutation {
                          createProjectV2(input: {ownerId: "${userId}", title: "${projectName}"}) {
                            projectV2 {
                              id
                            }
                          }
                        }
                      `);
                      projectId = newProject.createProjectV2.projectV2.id;
                      console.log(`Created new user project: ${projectName} (${projectId})`);
                    }
                  } catch (userError) {
                    console.log(`Error with user project operations: ${userError.message}`);
                    console.log("Trying organization projects instead...");
                    
                    // If user projects fail, try organization projects
                    try {
                      const orgProjectQuery = await octokit.graphql(`
                        query {
                          organization(login: "${owner}") {
                            projectsV2(first: 20) {
                              nodes {
                                id
                                title
                              }
                            }
                          }
                        }
                      `);
                      
                      const orgProjects = orgProjectQuery.organization.projectsV2.nodes;
                      const existingOrgProject = orgProjects.find(p => p.title === projectName);
                      
                      if (existingOrgProject) {
                        projectId = existingOrgProject.id;
                        console.log(`Found existing organization project: ${projectName} (${projectId})`);
                      } else {
                        // Create new project for organization
                        const orgIdQuery = await octokit.graphql(`
                          query {
                            organization(login: "${owner}") {
                              id
                            }
                          }
                        `);
                        
                        const orgId = orgIdQuery.organization.id;
                        
                        const newProject = await octokit.graphql(`
                          mutation {
                            createProjectV2(input: {ownerId: "${orgId}", title: "${projectName}"}) {
                              projectV2 {
                                id
                              }
                            }
                          }
                        `);
                        projectId = newProject.createProjectV2.projectV2.id;
                        console.log(`Created new organization project: ${projectName} (${projectId})`);
                      }
                    } catch (orgError) {
                      console.log(`Error with organization project operations: ${orgError.message}`);
                      console.log("Unable to create or find project. Continuing without project assignment.");
                    }
                  }
                } catch (error) {
                  console.log(`Error with project operations: ${error.message}`);
                  console.log("Continuing without project assignment.");
                }
              }
              
              // Process specified sprint or all sprints
              const sprintsToProcess = sprintNumber ? [sprintNumber] : ['1', '2', '3', '4', '5'];
              
              // Get all existing issues first to avoid duplicates
              console.log("Fetching all existing issues to prevent duplicates...");
              const allExistingIssues = [];
              let page = 1;
              let hasMoreIssues = true;
              
              while (hasMoreIssues) {
                const response = await octokit.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'all',
                  per_page: 100,
                  page: page
                });
                
                if (response.data.length === 0) {
                  hasMoreIssues = false;
                } else {
                  allExistingIssues.push(...response.data);
                  page++;
                  console.log(`Fetched ${response.data.length} issues (page ${page-1}), total: ${allExistingIssues.length}`);
                }
              }
              
              console.log(`Found ${allExistingIssues.length} total existing issues`);
              
              for (const sprint of sprintsToProcess) {
                const sprintTasks = extractSprintTasks(progressFile, sprint);
                console.log(`Found ${sprintTasks.length} tasks for Sprint ${sprint}`);
                
                if (sprintTasks.length === 0) {
                  continue;
                }
                
                // Get sprint title
                const sprintTitleRegex = new RegExp(`### Sprint ${sprint}: ([^\\(]+)`, 'g');
                const sprintTitleMatch = sprintTitleRegex.exec(progressFile);
                const sprintTitle = sprintTitleMatch ? sprintTitleMatch[1].trim() : `Sprint ${sprint}`;
                
                // Get sprint dates
                const sprintDatesRegex = new RegExp(`### Sprint ${sprint}: [^\\(]+ \\(([^\\)]+)\\)`, 'g');
                const sprintDatesMatch = sprintDatesRegex.exec(progressFile);
                const sprintDates = sprintDatesMatch ? sprintDatesMatch[1].trim() : '';
                
                // Create issues for each task
                for (const task of sprintTasks) {
                  try {
                    const issueTitle = `[Sprint ${sprint}] ${task.name}`;
                    
                    // Check if issue already exists with this title
                    const issueExists = allExistingIssues.some(issue => 
                      issue.title === issueTitle
                    );
                    
                    if (issueExists) {
                      console.log(`Issue already exists: ${issueTitle}`);
                      continue;
                    }
                    
                    // Format issue body with description, acceptance criteria, and subtasks
                    let issueBody = `# ${task.name}\n\n`;
                    issueBody += `## Description\n${task.description}\n\n`;
                    issueBody += `## Acceptance Criteria\n${task.acceptanceCriteria}\n\n`;
                    
                    // Add subtasks as a task list (checkboxes) if they exist
                    if (task.subtasks && task.subtasks.length > 0) {
                      issueBody += `## Subtasks\n\n`;
                      
                      for (let i = 0; i < task.subtasks.length; i++) {
                        const subtask = task.subtasks[i];
                        issueBody += `### ${i+1}. ${subtask.name}\n\n`;
                        issueBody += `- [ ] **${subtask.name}**\n`;
                        issueBody += `  **Description**: ${subtask.description}\n\n`;
                        issueBody += `  **Acceptance Criteria**:\n${subtask.acceptanceCriteria.split('\n').map(line => `  ${line}`).join('\n')}\n\n`;
                      }
                    }
                    
                    issueBody += `---\n\nTask from Sprint ${sprint}: ${sprintTitle} (${sprintDates})\n\nAutomatically created from memory-bank/progress.md`;
                    
                    // Create issue
                    const newIssue = await octokit.rest.issues.create({
                      owner,
                      repo,
                      title: issueTitle,
                      body: issueBody,
                      labels: [`sprint-${sprint}`, 'automated']
                    });
                    
                    console.log(`Created issue #${newIssue.data.number}: ${newIssue.data.title}`);
                    
                    // Add the new issue to our list of existing issues to prevent duplicates
                    // if the script runs multiple times in the same execution
                    allExistingIssues.push(newIssue.data);
                    
                    // Add to project if needed
                    if (createProject && projectId) {
                      try {
                        await octokit.graphql(`
                          mutation {
                            addProjectV2ItemById(input: {
                              projectId: "${projectId}",
                              contentId: "${newIssue.data.node_id}"
                            }) {
                              item {
                                id
                              }
                            }
                          }
                        `);
                        console.log(`Added issue #${newIssue.data.number} to project ${projectName}`);
                      } catch (error) {
                        console.log(`Error adding issue to project: ${error.message}`);
                      }
                    }
                  } catch (error) {
                    console.log(`Error creating issue: ${error.message}`);
                  }
                }
              }
            }
            
            // Run the process
            await processSprints();
