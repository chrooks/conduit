name: Add Issues to Project

on:
  issues:
    types:
      - opened

# Permissions for the GITHUB_TOKEN
permissions:
  # Required for checking out the repository
  contents: read
  # Required for accessing issues
  issues: read
  # Required for creating/updating projects
  repository-projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const issueNodeId = context.payload.issue.node_id;
            
            console.log(`Processing issue #${issueNumber} (${issueNodeId})`);
            
            const projectNumber = 1;
            console.log(`Attempting to access project #${projectNumber} for user ${owner}...`);
            
            try {
              let projectId = null;
              let statusFieldId = null;
              let backlogOptionId = null;
              let projectTitle = null;
              
              try {
                // Access project directly by number
                const projectQuery = await github.graphql(`
                  query {
                    user(login: "${owner}") {
                      projectV2(number: ${projectNumber}) {
                        id
                        title
                        fields(first: 20) {
                          nodes {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                              options {
                                id
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `);
                
                const project = projectQuery.user.projectV2;
                if (project) {
                  projectId = project.id;
                  projectTitle = project.title;
                  console.log(`Found project by number: ${projectTitle} (${projectId})`);
                  
                  // Find the status field and backlog option
                  const statusField = project.fields.nodes.find(field => 
                    field.name === 'Status' || field.name === 'status'
                  );
                  
                  if (statusField) {
                    statusFieldId = statusField.id;
                    const backlogOption = statusField.options.find(option => 
                      option.name === 'Backlog' || option.name === 'backlog' || option.name === 'To Do' || option.name === 'Todo'
                    );
                    
                    if (backlogOption) {
                      backlogOptionId = backlogOption.id;
                      console.log(`Found Status field (${statusFieldId}) and Backlog option (${backlogOptionId})`);
                    } else {
                      console.log(`Status field found but no Backlog option. Available options: ${statusField.options.map(o => o.name).join(', ')}`);
                    }
                  } else {
                    console.log(`No Status field found in project`);
                  }
                } else {
                  console.log(`Project #${projectNumber} not found for user ${owner}`);
                }
              } catch (error) {
                console.log(`Error accessing project #${projectNumber}: ${error.message}`);
                console.log("Trying to access project through viewer context...");
                
                // If direct access fails, try through the authenticated user's context
                try {
                  const viewerProjectQuery = await github.graphql(`
                    query {
                      viewer {
                        projectV2(number: ${projectNumber}) {
                          id
                          title
                          fields(first: 20) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `);
                  
                  const project = viewerProjectQuery.viewer.projectV2;
                  if (project) {
                    projectId = project.id;
                    projectTitle = project.title;
                    console.log(`Found project through viewer context: ${projectTitle} (${projectId})`);
                    
                    // Find the status field and backlog option
                    const statusField = project.fields.nodes.find(field => 
                      field.name === 'Status' || field.name === 'status'
                    );
                    
                    if (statusField) {
                      statusFieldId = statusField.id;
                      const backlogOption = statusField.options.find(option => 
                        option.name === 'Backlog' || option.name === 'backlog' || option.name === 'To Do' || option.name === 'Todo'
                      );
                      
                      if (backlogOption) {
                        backlogOptionId = backlogOption.id;
                        console.log(`Found Status field (${statusFieldId}) and Backlog option (${backlogOptionId})`);
                      } else {
                        console.log(`Status field found but no Backlog option. Available options: ${statusField.options.map(o => o.name).join(', ')}`);
                      }
                    } else {
                      console.log(`No Status field found in project`);
                    }
                  } else {
                    console.log(`Project #${projectNumber} not found through viewer context`);
                  }
                } catch (viewerError) {
                  console.log(`Error accessing project through viewer context: ${viewerError.message}`);
                }
              }
              
              if (!projectId) {
                console.log(`Could not access project #${projectNumber}. Cannot add issue to project.`);
                return;
              }
              
              // Add issue to project
              const addResponse = await github.graphql(`
                mutation {
                  addProjectV2ItemById(input: {
                    projectId: "${projectId}",
                    contentId: "${issueNodeId}"
                  }) {
                    item {
                      id
                    }
                  }
                }
              `);
              
              const itemId = addResponse.addProjectV2ItemById.item.id;
              console.log(`Added issue #${issueNumber} to project ${projectTitle} (item ID: ${itemId})`);
              
              // Set status to Backlog if we found the status field and backlog option
              if (statusFieldId && backlogOptionId) {
                await github.graphql(`
                  mutation {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: "${projectId}",
                      itemId: "${itemId}",
                      fieldId: "${statusFieldId}",
                      value: { 
                        singleSelectOptionId: "${backlogOptionId}"
                      }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `);
                
                console.log(`Set issue #${issueNumber} status to Backlog in project ${projectTitle}`);
              } else {
                console.log(`Could not set status to Backlog: missing status field or backlog option`);
              }
              
            } catch (error) {
              console.log(`Error processing issue: ${error.message}`);
            }
